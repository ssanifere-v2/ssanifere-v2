<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscription — SANI-FÉRÉ</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --turquoise: #00BFA5;
    --turquoise-dark: #00897B;
    --turquoise-light: #E0F7FA;
    --corail: #FF6F61;
    --gris-bg: #F7F9FC;
    --gris-text: #6B7280;
    --noir: #1A1A2E;
    --blanc: #FFFFFF;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Quicksand', sans-serif;
    background: var(--gris-bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--blanc);
    box-shadow: 0 2px 12px rgba(0,191,165,0.10);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo {
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 22px;
    color: var(--turquoise-dark);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .logo-dot { width: 8px; height: 8px; background: var(--corail); border-radius: 50%; }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }

  .card {
    background: var(--blanc);
    border-radius: 24px;
    padding: 40px;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.08);
  }

  .card-title {
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 26px;
    color: var(--noir);
    margin-bottom: 6px;
  }
  .card-sub {
    font-size: 14px;
    color: var(--gris-text);
    margin-bottom: 32px;
  }

  .role-tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 28px;
  }
  .role-tab {
    flex: 1;
    padding: 12px;
    border: 2px solid #E2E8F0;
    border-radius: 12px;
    text-align: center;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 13px;
    color: var(--gris-text);
    transition: all 0.2s;
  }
  .role-tab.active {
    border-color: var(--turquoise);
    background: var(--turquoise-light);
    color: var(--turquoise-dark);
  }
  .role-tab .role-icon { font-size: 20px; display: block; margin-bottom: 4px; }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .form-group { margin-bottom: 18px; }
  label {
    display: block;
    font-weight: 700;
    font-size: 13px;
    color: var(--noir);
    margin-bottom: 7px;
  }
  input, select {
    width: 100%;
    padding: 13px 16px;
    border: 2px solid #E2E8F0;
    border-radius: 12px;
    font-family: 'Quicksand', sans-serif;
    font-size: 14px;
    color: var(--noir);
    outline: none;
    transition: border-color 0.2s;
    background: var(--gris-bg);
    appearance: none;
  }
  input:focus, select:focus { border-color: var(--turquoise); background: var(--blanc); }

  .btn-submit {
    width: 100%;
    padding: 14px;
    background: var(--corail);
    color: var(--blanc);
    border: none;
    border-radius: 12px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 15px;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 8px;
  }
  .btn-submit:hover { background: #e05a4d; transform: translateY(-1px); }
  .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .divider {
    text-align: center;
    color: var(--gris-text);
    font-size: 13px;
    margin: 20px 0;
    position: relative;
  }
  .divider::before, .divider::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 42%;
    height: 1px;
    background: #E2E8F0;
  }
  .divider::before { left: 0; }
  .divider::after { right: 0; }

  .link-switch {
    text-align: center;
    font-size: 14px;
    color: var(--gris-text);
  }
  .link-switch a {
    color: var(--turquoise-dark);
    font-weight: 700;
    text-decoration: none;
  }

  .msg {
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 20px;
    display: none;
  }
  .msg.error { background: #FFF0EE; color: #e05a4d; border: 1px solid #FFD5D0; }
  .msg.success { background: var(--turquoise-light); color: var(--turquoise-dark); border: 1px solid #B2DFDB; }
  .msg.show { display: block; }

  .vendeur-fields { display: none; }
  .vendeur-fields.show { display: block; }
</style>
</head>
<body>

<header>
  <a href="/" class="logo">SANI-FÉRÉ <span class="logo-dot"></span></a>
  <span style="font-size:13px; color:var(--gris-text);">🇲🇱 Mali</span>
</header>

<main>
  <div class="card">
    <div class="card-title">Créer un compte</div>
    <div class="card-sub">Rejoignez SANI-FÉRÉ gratuitement</div>

    <div id="msg" class="msg"></div>

    <!-- Choix rôle -->
    <div class="role-tabs">
      <div class="role-tab active" id="tab-acheteur" onclick="setRole('acheteur')">
        <span class="role-icon">🛒</span>Acheteur
      </div>
      <div class="role-tab" id="tab-vendeur" onclick="setRole('vendeur')">
        <span class="role-icon">🏪</span>Vendeur
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Prénom</label>
        <input type="text" id="prenom" placeholder="Votre prénom">
      </div>
      <div class="form-group">
        <label>Nom</label>
        <input type="text" id="nom" placeholder="Votre nom">
      </div>
    </div>

    <div class="form-group">
      <label>Téléphone</label>
      <input type="tel" id="telephone" placeholder="Ex: 70000000">
    </div>

    <div class="form-group">
      <label>Email (optionnel)</label>
      <input type="email" id="email" placeholder="votre@email.com">
    </div>

    <div class="form-group">
      <label>Ville</label>
      <select id="ville">
        <option value="">Sélectionnez votre ville</option>
        <option value="Bamako">Bamako</option>
        <option value="Sikasso">Sikasso</option>
        <option value="Mopti">Mopti</option>
        <option value="Ségou">Ségou</option>
        <option value="Kayes">Kayes</option>
        <option value="Koutiala">Koutiala</option>
        <option value="Gao">Gao</option>
        <option value="Tombouctou">Tombouctou</option>
      </select>
    </div>

    <!-- Champs vendeur uniquement -->
    <div class="vendeur-fields" id="vendeur-fields">
      <div class="form-group">
        <label>Nom de la boutique</label>
        <input type="text" id="boutique" placeholder="Ex: Boutique Fatoumata">
      </div>
      <div class="form-group">
        <label>Description boutique</label>
        <input type="text" id="description" placeholder="Ce que vous vendez...">
      </div>
    </div>

    <div class="form-group">
      <label>Mot de passe</label>
      <input type="password" id="password" placeholder="Minimum 6 caractères">
    </div>

    <button class="btn-submit" id="btn-register" onclick="register()">Créer mon compte →</button>

    <div class="divider">ou</div>

    <div class="link-switch">
      Déjà un compte ? <a href="/connexion.html">Se connecter →</a>
    </div>
  </div>
</main>

<script>
const API = 'https://web-production-8f94.up.railway.app';
let currentRole = 'acheteur';

function setRole(role) {
  currentRole = role;
  document.getElementById('tab-acheteur').classList.toggle('active', role === 'acheteur');
  document.getElementById('tab-vendeur').classList.toggle('active', role === 'vendeur');
  document.getElementById('vendeur-fields').classList.toggle('show', role === 'vendeur');
}

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = `msg ${type} show`;
}

async function register() {
  const prenom = document.getElementById('prenom').value.trim();
  const nom = document.getElementById('nom').value.trim();
  const telephone = document.getElementById('telephone').value.trim();
  const email = document.getElementById('email').value.trim();
  const ville = document.getElementById('ville').value;
  const password = document.getElementById('password').value.trim();
  const btn = document.getElementById('btn-register');

  if (!prenom || !nom || !telephone || !ville || !password) {
    showMsg('Veuillez remplir tous les champs obligatoires.', 'error');
    return;
  }
  if (password.length < 6) {
    showMsg('Le mot de passe doit contenir au moins 6 caractères.', 'error');
    return;
  }

  const body = {
    prenom,
    nom,
    telephone,
    email: email || undefined,
    ville,
    mot_de_passe: password,
    role: currentRole
  };

  if (currentRole === 'vendeur') {
    body.nom_boutique = document.getElementById('boutique').value.trim();
    body.description = document.getElementById('description').value.trim();
  }

  btn.disabled = true;
  btn.textContent = 'Création en cours...';

  try {
    const res = await fetch(`${API}/api/auth/register`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    const data = await res.json();

    if (res.ok) {
      if (data.token) {
        localStorage.setItem('sf_token', data.token);
        localStorage.setItem('sf_user', JSON.stringify(data.utilisateur || {}));
      }
      showMsg('Compte créé avec succès ! Redirection...', 'success');
      setTimeout(() => window.location.href = '/', 1500);
    } else {
      showMsg(data.detail || data.message || 'Erreur lors de la création du compte.', 'error');
      btn.disabled = false;
      btn.textContent = 'Créer mon compte →';
    }
  } catch (err) {
    showMsg('Erreur réseau. Réessayez.', 'error');
    btn.disabled = false;
    btn.textContent = 'Créer mon compte →';
  }
}
</script>
</body>
</html>
